[build-system]
# 77: the SPDX `license` expression and `license-files` (PEP 639).
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "noworkflow"
# dynamically loaded version; see below
dynamic = ["version", "readme"]
description = "Supporting infrastructure to run scientific experiments without a scientific workflow management system."
authors = [
    {name = "Joao Pimentel", email = "jpimentel@ic.uff.br"},
    {name = "Leonardo Murta", email = "leomurta@ic.uff.br"},
    {name = "Vanessa Braganholo", email = "vanessa@ic.uff.br"},
    {name = "Juliana Freire", email = "juliana.freire@nyu.edu"},
    {name = "Arthur Paiva", email = "arthur.paiva@id.uff.br"},
    {name = "Other collaborators"},
]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["scientific", "experiments", "provenance", "python"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
requires-python = ">=3.11"
dependencies = [
    # 1.7.0: with 1.6, `now run` fails collecting the definitions of a script
    # with {**d}, a positional-only parameter with a default or a decorated
    # definition (AttributeError, TypeError, IndexError; #225).
    "pyposast>=1.7.0",
    "apted",
    "future",
    # <2: the models use the 1.4 API that 2.0 removed (select([...]),
    # Connection.execute with autocommit, string statements; the SQLAlchemy
    # premises of tests/premises say where). >=1.4.29 came with 8fdde50,
    # which moved the test helpers to Session.get.
    "SQLAlchemy>=1.4.29,<2",
    "parameterized",
    "requests",
    "ipykernel",
    "nbformat",
    "graphviz",
    # 2.3.3: the first release that requires a Werkzeug (2.3.7) whose
    # routing does not use ast.Str, which Python 3.14 removed; with an
    # older one `now vis` fails building its first route. Below 2.3 the
    # routes also answer differently from what tests/vis pins.
    "flask>=2.3.3"
]

[project.optional-dependencies]
demo = ["flask", "matplotlib", "numpy", "cython"]
notebook = ["pyposast", "ipython", "jupyter"]
all = [
    "pyposast", "ipython", "jupyter", "pyswip-alt",
    "matplotlib", "numpy", "cython", "jsonpickle"
]

[project.scripts]
now = "noworkflow:main"

[project.urls]
Homepage = "https://gems-uff.github.io/noworkflow/"
Repository = "https://github.com/gems-uff/noworkflow.git"
Issues = "https://github.com/gems-uff/noworkflow/issues"
Changelog = "https://github.com/gems-uff/noworkflow/releases"


[tool.setuptools.package-data]
noworkflow = [
    "resources/**/*",
    "now/vis/static/**/*",
    "now/vis/templates/**/*"
]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.dynamic]
version = {file = "src/noworkflow/resources/version.txt"}
readme = {file = "README.md", content-type = "text/markdown"}

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5",
    # 5.0: the first version whose order depends on the seed alone, so the
    # seed in a CI summary reproduces that order on any machine.
    "pytest-randomly>=5",
    # Runs the suite in parallel (`-n 4` on the Linux legs of ci.yml, #426).
    # 3.8: the version measured with this suite.
    "pytest-xdist>=3.8",
    "ruff>=0.14",
    "bandit[toml]>=1.7.10",
    # 2.9: --locked, which audits a PEP 751 pylock.toml (the audit step of
    # ci.yml).
    "pip-audit>=2.9",
    # tests/test_import_smoke.py asks setuptools which packages the wheel
    # ships; no module of noworkflow imports it (#225). 77: the floor of
    # [build-system], whose package discovery the test reproduces.
    "setuptools>=77",
]
# What the paper's running example imports (src/noworkflow/tests/e2e/corpus/
# paper_example). Not in dev, so the matrix legs stay light: only the
# `paper-example` job of ci.yml and the reference-leg container sync it, and
# without it the tests of the example skip.
paper = [
    "scikit-learn",
    "imbalanced-learn",
    "pandas",
]
# What the tests of the vis in a browser import (src/noworkflow/tests/
# browser). Not in dev, so the matrix legs stay light: only the
# `vis-browser` job of ci.yml syncs it, and without it those tests skip.
# Playwright drives the Chrome already installed (channel "chrome"): its own
# browsers are never downloaded.
browser = [
    "playwright",
]
# The optional content engines (src/noworkflow/now/persistence/content/),
# which no declaration of [project] covers: the tests marked `engines`
# import them. Only the `engines` job of ci.yml syncs this group, and only
# those tests run with it: once one of these imports, every new store without
# --content-engine takes its engine (define_engine), which the rest of the
# suite does not expect (#255). Without it those tests skip.
engines = [
    "dulwich",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = [
    "src/noworkflow/tests",
    "src/noworkflow/now/persistence/models",
    "src/noworkflow/now/utils/formatter.py",
    "src/noworkflow/now/utils/functions.py",
    "src/noworkflow/patterns/machinery.py",
]
python_files = ["test_*.py", "*_test.py"]  # the second pattern matches cross_version_test.py
addopts = "--doctest-modules --doctest-report=only_first_failure --durations=10 --strict-markers -ra --cov-report=term --cov-report=xml"
markers = [
    "golden: compares against a stored golden output",
    "slow: needs the console `now` and matplotlib",
    "paper: replays the paper's running example; needs the `paper` group, runs in the paper-example job",
    "browser: drives the vis in Chrome; needs the `browser` group, runs in the vis-browser job",
    "engines: runs an optional content engine; needs the `engines` group, runs in the engines job",
]
# A deprecation that noWorkflow's own code triggers fails the test that
# triggers it. The exceptions, listed after it so that they take precedence,
# are known and tracked: SQLAlchemy 1.4 warns once per process at the first
# use of an API that 2.0 removed, the use the SQLAlchemy pin keeps (the
# premises in test_premises.py); trial_ast builds ast nodes with arguments
# that Python 3.13 deprecated and 3.15 rejects (#241, leaves with its fix).
filterwarnings = [
    "error::DeprecationWarning:noworkflow",
    "default::sqlalchemy.exc.Base20DeprecationWarning",
    "default::DeprecationWarning:noworkflow.now.models.ast.trial_ast",
]

[tool.coverage.run]
source = ["noworkflow"]
omit = [
    "*/noworkflow/tests/*",
    "*/noworkflow/resources/*",
]
patch = ["subprocess"]  # covers the `now` that the e2e harness runs in a subprocess

[tool.ruff]
target-version = "py311"
# Not linted: scripts that noWorkflow traces (demo, test examples, e2e
# corpus, the root tests/), the Examples notebooks, and material outside the
# package. "tests/" with the slash is the root directory only; a bare "tests"
# would also match src/noworkflow/tests and leave the test package unlinted.
extend-exclude = [
    "src/noworkflow/resources/demo",
    "src/noworkflow/tests/examples",
    "src/noworkflow/tests/e2e/corpus",
    "tests/",
    "Examples",
    "history",
    "docs",
    "src/frontend",
]
# Injected into builtins by the collector while a traced script runs.
builtins = ["__noworkflow__"]

[tool.ruff.format]
# LF in the repository and in the working tree, on every platform (.gitattributes).
line-ending = "lf"

[tool.ruff.lint]
# ruff's default set (E4, E7, E9, F) plus W605, B006 (mutable argument
# defaults) and I (import order), all blocking. An intended exception carries
# `# noqa: <code>` on its line, with the reason on the line above, like
# `# nosec`; an import block whose order matters, `# isort: off` and
# `# isort: on` around it, with the reason. E501 never (the formatter owns
# line length); no S, because bandit is the SAST.
select = ["E4", "E7", "E9", "F", "W605", "B006", "I"]

[tool.ruff.lint.per-file-ignores]
# Python 2 compatibility shim: names that only exist on Python 2, re-exports.
"src/noworkflow/now/utils/cross_version.py" = ["F401", "F821"]
# Package re-exports.
"__init__.py" = ["F401"]

[tool.bandit]
# Tests and the traced demo scripts are not product code that runs on a
# user's data.
exclude_dirs = [
    "src/noworkflow/tests",
    "src/noworkflow/resources/demo",
]
skips = []
