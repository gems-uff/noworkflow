[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "noworkflow"
# dynamically loaded version; see below
dynamic = ["version", "readme"]
description = "Supporting infrastructure to run scientific experiments without a scientific workflow management system."
authors = [
    {name = "Joao Pimentel", email = "jpimentel@ic.uff.br"},
    {name = "Leonardo Murta", email = "leomurta@ic.uff.br"},
    {name = "Vanessa Braganholo", email = "vanessa@ic.uff.br"},
    {name = "Juliana Freire", email = "juliana.freire@nyu.edu"},
    {name = "Arthur Paiva", email = "arthur.paiva@id.uff.br"},
    {name = "Other collaborators"},
]
license = {text = "MIT"}
keywords = ["scientific", "experiments", "provenance", "python"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.8"
dependencies = [
    "pyposast",
    "apted",
    "future",
    "SQLAlchemy>=1.4.29,<=1.4.47",
    "parameterized",
    "requests",
    "ipykernel",
    "zipp==3.15",
    "importlib-metadata==6.4.1",
    "typing-extensions>=4.5.0,<5",
    "setuptools<72",
    "nbformat",
    "graphviz",
    "flask"
]

[project.optional-dependencies]
demo = ["flask", "matplotlib", "numpy", "cython"]
notebook = ["pyposast", "ipython", "jupyter"]
all = [
    "pyposast", "ipython", "jupyter", "pyswip-alt",
    "matplotlib", "numpy", "cython"
]

[project.scripts]
now = "noworkflow:main"

[project.urls]
Homepage = "https://gems-uff.github.io/noworkflow/"
Repository = "https://github.com/gems-uff/noworkflow.git"
Issues = "https://github.com/gems-uff/noworkflow/issues"


[tool.setuptools.package-data]
noworkflow = [
    "resources/**/*",
    "now/vis/static/**/*",
    "now/vis/templates/**/*"
]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.dynamic]
version = {file = "src/noworkflow/resources/version.txt"}
readme = {file = "README.md", content-type = "text/markdown"}

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5",
    "ruff>=0.14",
    "bandit[toml]>=1.7.10",
    "pip-audit>=2.7",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = [
    "src/noworkflow/tests",
    "src/noworkflow/now/persistence/models",
    "src/noworkflow/now/utils/formatter.py",
    "src/noworkflow/now/utils/functions.py",
]
python_files = ["test_*.py", "*_test.py"]  # the second pattern matches cross_version_test.py
addopts = "--doctest-modules --doctest-report=only_first_failure --durations=10 --strict-markers -ra --cov-report=term --cov-report=xml"
markers = [
    "golden: compares against a stored golden output",
    "slow: needs the console `now` and matplotlib",
]
filterwarnings = ["default::DeprecationWarning:noworkflow"]  # Round 3 promotes it to error::

[tool.coverage.run]
source = ["noworkflow"]
omit = [
    "*/noworkflow/tests/*",
    "*/noworkflow/resources/*",
    "*/prov_deployment/py2module.py",
]
patch = ["subprocess"]  # covers the `now` that the e2e harness runs in a subprocess
