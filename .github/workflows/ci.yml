name: CI

on:
  push:
  pull_request:
  # Weekly watch over the dependencies. A new advisory makes uv.lock or the
  # npm lock vulnerable without anyone changing a line, and the other triggers
  # only fire on a push. On this trigger only the `checks` job runs (see the
  # `if` on the other jobs): the suite and the bundle do not change without a
  # commit, and running them here would repeat the last result.
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

# A newer push to the same branch or PR makes the running workflow obsolete.
# On `main` every commit keeps its own run: tasks land there directly, and a
# cancelled run would leave a commit without a verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# No job writes to the repository: only checkout, setup and artifact upload.
permissions:
  contents: read

# Windows runners default to pwsh; every `run` here is bash, so `set -o
# pipefail` and the scripts behave the same on the three systems.
defaults:
  run:
    shell: bash

jobs:
  # Checks that need neither the matrix nor the frontend, in a job of their own
  # and in parallel with the suite, so a cheap red here does not hide the
  # result of the tests. Every check after the install runs even when an
  # earlier one failed, so one push shows all of them. On the weekly trigger
  # only the lock and the two audits run: lint, SAST and the build cannot
  # change without a commit.
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # The tools come from the dev group of uv.lock, so their versions move
      # only with the lock, like everything else.
      - name: Install uv and Python 3.13
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true

      # pyproject.toml changed without `uv lock`: every `uv sync --locked`
      # below would fail with a message about the lock, far from the cause.
      - name: Lock is up to date
        run: uv lock --check

      - name: Install dependencies
        id: sync
        run: uv sync --locked

      # Audits exactly the versions in uv.lock (every group, every platform
      # marker), not whatever this runner happens to resolve. --no-deps and
      # --disable-pip: the export is already the full pinned set, so pip-audit
      # only queries the advisories.
      #
      # Ignored advisories, present since the job was created; each one leaves
      # with the pin that keeps it, in Round 3 (#225). Never add one here
      # without the reason and the issue that removes it.
      # - GHSA-jfmj-5v4g-7637 (CVE-2024-5569, zipp): `zipp==3.15` in
      #   [project.dependencies] has no recorded reason; noworkflow does not
      #   import zipp.
      # - GHSA-5rjg-fvgr-3xxf (CVE-2025-47273) and GHSA-h35f-9h28-mq5c
      #   (CVE-2026-59890), setuptools: `setuptools<72` keeps pkg_resources,
      #   which deployment.py and utils/functions.py import (PR #186 moves them
      #   to importlib.metadata). Both advisories are in PackageIndex and sdist
      #   building, which noworkflow does not call.
      - name: Audit Python dependencies
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: |
          uv export --locked --format requirements-txt --no-emit-project --all-groups --no-hashes -o requirements-audit.txt
          uv run --no-sync pip-audit -r requirements-audit.txt --no-deps --disable-pip --strict --desc on \
            --ignore-vuln GHSA-jfmj-5v4g-7637 \
            --ignore-vuln GHSA-5rjg-fvgr-3xxf \
            --ignore-vuln GHSA-h35f-9h28-mq5c

      # Not a gate yet: the critical runtime advisories (elliptic, pbkdf2,
      # sha.js) come from crypto-browserify, a dependency of @noworkflow/nowvis
      # whose code ends up in bundle.js, and fixing them means rebuilding the
      # bundle, which is Round 3 (#225). Until then the red shows on the step
      # without failing the job. --package-lock-only: no node_modules needed.
      - name: Audit frontend dependencies
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: npm audit --prefix src/frontend --package-lock-only --omit=dev --audit-level=high

      # Phase A of the lint: only rules already at zero are selected; the
      # rules that still have occurrences are listed under `ignore` in
      # pyproject.toml and leave it in Round 3 (#221).
      - name: Lint
        if: ${{ !cancelled() && steps.sync.outcome == 'success' && github.event_name != 'schedule' }}
        run: uv run --no-sync ruff check --output-format=github .

      # SAST. bandit-baseline.json is the inventory of the findings that
      # existed when this job was created; only findings outside it fail.
      # Matching ignores line numbers, so unrelated edits do not break it.
      # Round 3 (#223) turns the inventory into `# nosec Bxxx` comments with a
      # reason, or real fixes, and deletes the file. Regenerate it only in
      # that round:
      #   uv run bandit -c pyproject.toml -r src/noworkflow -q -f json \
      #     | jq '{results: .results}' > bandit-baseline.json
      - name: SAST (bandit)
        if: ${{ !cancelled() && steps.sync.outcome == 'success' && github.event_name != 'schedule' }}
        run: uv run --no-sync bandit -c pyproject.toml -r src/noworkflow -q -b bandit-baseline.json

      # The wheel is what `pip install noworkflow` gets. version.txt and
      # bundle.js reach it only through package-data globs; if a glob or the
      # build backend drops them, `now --version` and `now vis` break on
      # install while the suite, which runs from the source tree, stays green.
      - name: Build the package
        if: ${{ !cancelled() && github.event_name != 'schedule' }}
        run: |
          uv build
          contents=$(unzip -Z1 dist/*.whl)
          for file in noworkflow/resources/version.txt noworkflow/now/vis/static/dist/bundle.js; do
            if ! grep -qxF "$file" <<<"$contents"; then
              echo "::error::$file is missing from the wheel"
              exit 1
            fi
          done

  test:
    if: github.event_name != 'schedule'
    # Legs are independent: a red on one version does not cancel the others,
    # so the panel tells whether a failure is specific to a version or system.
    # Legs still under observation (next Python, Windows) live in
    # experimental.yml; promoting one means moving it to this matrix.
    strategy:
      fail-fast: false
      matrix:
        # min-tests: floor for passed + skipped + xfailed + xpassed. Raise it
        # when tests are added; lower it only with the reason written in the PR.
        include:
          # Oldest supported Python (requires-python = ">=3.8").
          - { os: ubuntu-latest, python: "3.8", min-tests: 343 }
          - { os: ubuntu-latest, python: "3.12", min-tests: 343 }
          # Reference leg: the only one with coverage and with goldens, which
          # depend on the system and on the Python version.
          - { os: ubuntu-latest, python: "3.13", min-tests: 343, reference: true }
          - { os: ubuntu-latest, python: "3.14", min-tests: 343 }
          - { os: macos-latest, python: "3.13", min-tests: 343 }
    name: test (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # uv installs the interpreter itself (python-build-standalone), so 3.8
      # works on runner images where actions/setup-python no longer has it.
      - name: Install uv and Python ${{ matrix.python }}
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      # --locked: install exactly what uv.lock says, and fail instead of
      # silently re-resolving when the lock and pyproject.toml disagree.
      - name: Install dependencies
        id: sync
        run: uv sync --locked

      # The root conftest.py runs the session from a scratch directory, so the
      # coverage path must be absolute. Goldens only exist for the reference
      # leg; elsewhere the `golden` marker is deselected.
      - name: Run tests
        env:
          GOLDEN: ${{ matrix.reference && 'require' || '' }}
        run: |
          set -o pipefail
          args=()
          if [ "${{ matrix.reference }}" = "true" ]; then
            args+=(--cov "--cov-report=xml:$GITHUB_WORKSPACE/coverage.xml")
          else
            args+=(-m "not golden")
          fi
          uv run --no-sync pytest "${args[@]}" | tee pytest.log

      # Count, seed and reproduction command in the job summary, one click
      # away. It also fails the job when the count drops below min-tests or
      # the log has no summary line: a zero exit status does not prove that
      # the tests ran.
      - name: Record the test count and the seed
        if: ${{ !cancelled() }}
        run: |
          if [ "${{ matrix.reference }}" = "true" ]; then
            repro='uv sync --locked --python ${{ matrix.python }} && GOLDEN=require uv run --no-sync pytest'
          else
            repro='uv sync --locked --python ${{ matrix.python }} && uv run --no-sync pytest -m "not golden"'
          fi
          bash .github/scripts/pytest-summary.sh pytest.log "${{ matrix.min-tests }}" \
            "${{ matrix.os }}, ${{ matrix.python }}" "$repro"

      # The suite imports noworkflow; nothing in it runs the installed `now`
      # entry point from a plain directory the way a user does. Runs even when
      # tests fail, as a separate signal.
      - name: CLI smoke test
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        working-directory: ${{ runner.temp }}
        run: |
          set -o pipefail
          mkdir now-smoke && cd now-smoke
          now() { uv run --no-sync --project "$GITHUB_WORKSPACE" now "$@"; }
          printf 'print("hello from noWorkflow")\n' > hello.py
          now --version
          now run hello.py | tee run.log
          grep -q "hello from noWorkflow" run.log
          now list | tee list.log
          grep -q "run hello.py" list.log

      # Coverage comes from the reference leg alone: the other legs run the
      # same code. A fork PR cannot write to the base repository, hence the
      # guard; the `coverage` job publishes this artifact.
      - name: Upload the Cobertura report
        if: matrix.reference && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-python
          path: coverage.xml

  # Publishes the reference leg's report to the repository's code quality view.
  # No threshold: the rule is "test count >= floor" (see min-tests), not a
  # percentage. A job of its own, with the only write permission of the
  # workflow, so the test legs keep read-only tokens. No checkout: the action
  # needs only the report. The `if` mirrors the one on the artifact upload: a
  # fork PR has no artifact, and `!cancelled()` plus the result check keep the
  # job from running (or being skipped by implication) after a red or skipped
  # `test`.
  coverage:
    if: ${{ !cancelled() && needs.test.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
      pull-requests: read
    steps:
      - name: Download the Cobertura report
        uses: actions/download-artifact@v8
        with:
          name: coverage-report-python

      # fail-on-error: false: the upload is a report, not a gate; an outage of
      # the coverage API must not turn a green suite red.
      - name: Upload coverage to code quality
        uses: actions/upload-code-coverage@v1
        with:
          file: coverage.xml
          language: Python
          label: code-coverage/pytest-cov
          fail-on-error: false

  # bundle.js is committed, because `pip install noworkflow` must serve `now
  # vis` without Node. Nothing forced whoever changed src/frontend to rebuild
  # it. The bundle is reproducible byte for byte; the .map is not (it embeds
  # the absolute path of the machine that built it), so only bundle.js is
  # compared.
  frontend:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Node 26 is the major measured to reproduce the committed bundle.
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build the vis bundle
        run: npx lerna run build --scope=@noworkflow/nowvis --include-dependencies

      # Type-check of the Jupyter extension. Its full `build` needs jupyterlab
      # (`jupyter labextension build`); `build:lib` is plain tsc.
      - name: Type-check the lab extension
        run: npx lerna run build:lib --scope=@noworkflow/labextension

      - name: Committed bundle matches the sources
        run: |
          bundle=../noworkflow/now/vis/static/dist/bundle.js
          if ! git diff --quiet -- "$bundle"; then
            git diff --stat -- "$bundle"
            echo "::error file=src/noworkflow/now/vis/static/dist/bundle.js::bundle.js differs from a fresh build of src/frontend. Rebuild it (cd src/frontend && npm ci && npm run build) and commit it with the source change."
            exit 1
          fi

  # The only status the ruleset on `main` requires: one name that stays stable
  # while jobs and matrix legs come and go. `always()` makes it run, and fail,
  # when a needed job failed; without it the job would be skipped, and a
  # skipped required check counts as passing.
  ci-ok:
    if: always() && github.event_name != 'schedule'
    needs: [checks, test, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::checks=${{ needs.checks.result }} test=${{ needs.test.result }} frontend=${{ needs.frontend.result }}"
          exit 1
