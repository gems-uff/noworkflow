name: Pre-release matrix

# The whole matrix, run by hand before a release (the `release` skill) and
# whenever a change may depend on the system: Linux, macOS and Windows on
# every Python version python.org maintains. A push runs only the Linux legs
# of ci.yml: in 99 runs of ci.yml no Python version failed alone and the
# only leg that failed alone was macOS, while the macOS legs set the pace of
# every push (#426). Windows joined once its legs passed (#374).
on:
  workflow_dispatch:

# No job writes to the repository: only checkout, setup and artifact upload.
permissions:
  contents: read

defaults:
  run:
    shell: bash

# The interpreter uv downloads, never the runner image's (see ci.yml).
env:
  UV_MANAGED_PYTHON: "1"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        # min-tests: the non-golden floor of ci.yml; raise both together.
        # workers: one per vCPU. The Linux runner has 4; the macOS runner has
        # 3 and 7 GB, where three workers measured only 1.25 times faster
        # than one (#426). Windows runs serially (-n 0): workers there were
        # never measured.
        # warn-encoding: warns wherever open() and friends rely on the locale
        # encoding, which is cp1252 on Windows and UTF-8 elsewhere. 3.15
        # turns UTF-8 mode on by default (PEP 686), so the Windows legs read
        # files differently below and from 3.15.
        include:
          - { os: ubuntu-latest, min-tests: 3097, workers: 4 }
          - { os: macos-latest, min-tests: 3097, workers: 3 }
          - { os: windows-latest, min-tests: 3097, workers: 0, warn-encoding: "1" }
    name: test (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    env:
      PYTHONWARNDEFAULTENCODING: ${{ matrix.warn-encoding }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv and Python ${{ matrix.python }}
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Install dependencies
        id: sync
        run: uv sync --locked

      # The runner's temporary directory is on C:, while the checkout, its
      # .venv and the Python uv installs are under D:\a. A project on another
      # drive than the modules it imports is #294, which crashes the first
      # import of a module under `now run`; with every project of the suite
      # there, the legs measured #294 instead of what each test is about.
      # pytest's temporary directory follows TEMP and TMP, so the projects
      # share Python's drive, as on a machine with everything on one drive.
      - name: Put the temporary directory on Python's drive (Windows)
        if: runner.os == 'Windows'
        run: |
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"

      # SWI-Prolog and Graphviz on the Linux and macOS legs, as in ci.yml:
      # without swipl the patterns tests and the Prolog-fact tests skip, and
      # without `dot` the tests that run Graphviz, as they do on the Windows
      # legs.
      - name: Install SWI-Prolog and Graphviz (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends swi-prolog-nox graphviz

      - name: Install SWI-Prolog and Graphviz (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install swi-prolog graphviz

      # Goldens exist for the reference leg of ci.yml only, the `paper`
      # tests run in its paper-example job and the `browser` ones in its
      # vis-browser job.
      - name: Run tests
        run: |
          set -o pipefail
          uv run --no-sync pytest -n ${{ matrix.workers }} -m "not golden and not paper and not browser and not engines" | tee pytest.log

      - name: Record the test count and the seed
        if: ${{ !cancelled() }}
        run: |
          bash .github/scripts/pytest-summary.sh pytest.log "${{ matrix.min-tests }}" \
            "${{ matrix.os }}, ${{ matrix.python }}" \
            'uv sync --locked --python ${{ matrix.python }} && uv run --no-sync pytest -n ${{ matrix.workers }} -m "not golden and not paper and not browser and not engines"'

      # The suite runs `now` through `python -m noworkflow`; this runs the
      # installed console script from a plain directory, as in ci.yml.
      - name: CLI smoke test
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        working-directory: ${{ runner.temp }}
        run: |
          set -o pipefail
          mkdir now-smoke && cd now-smoke
          now() { uv run --no-sync --project "$GITHUB_WORKSPACE" now "$@"; }
          printf 'print("hello from noWorkflow")\n' > hello.py
          now --version
          now run hello.py | tee run.log
          grep -q "hello from noWorkflow" run.log
          now list | tee list.log
          grep -q "run hello.py" list.log
